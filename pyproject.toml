[project]
name = "vtuber-reception-system"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.2.2",
    "python-dotenv>=1.1.1",
    "google-apps-meet>=0.1.16",
    "selenium>=4.33.0",
    "psutil>=5.9.0",
    "flet[all]>=0.28.3",
    "requests>=2.31.0",
]

[tool.uv]
[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --------------------------------------------------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 119
indent-width = 4

[tool.ruff.lint]
# cf. https://docs.astral.sh/ruff/rules/
## ルール
select = ["ALL"] # 全てのチェックを有効にする（Verアップグレードで暗黙的にルールが追加されることは受け入れる）
ignore = [
    "D1",     # missing-docstring: D1のみをignoreさせることで、docstringを書いた場合は書いた内容にpydocstyleのルールが適用される
    "TD001",  # invalid-todo-tag: FIXMEも許容するため
    "TD002",  # missing-todo-author: 作者名を書くのが面倒なため
    "TD003",  # missing-todo-link: リンクを貼るのが面倒なため
    "ANN1",   # missing-type-self, missing-type-cls: selfとclsの型ヒントは冗長なため
    "G004",   # logging-f-string: loggingでf-stringを使いたいので無視する
    "PGH003", # blanket-type-ignore: 対応が面倒なため
    "PGH004", # blanket-noqa: 対応が面倒なため
    "ANN401", # any-type: anyに名前をつけるのは面倒なため
    "RUF001", # ambiguous-unicode-character-string: 曖昧なUnicode文字を許可
    "RUF003", # ambiguous-unicode-character-comment: コメントの曖昧なUnicode文字を許可
    "RUF002", # ambiguous-unicode-character-docstring: docstringの曖昧なUnicode文字を許可
    "D415",   # first-line-should-end-with-period: docstring第一行の句読点は非強制
    "ANN002", # missing-type-annotation-for-args: *argsの型アノテーション不足
    "ANN003", # missing-type-annotation-for-kwargs: **kwargsの型アノテーション不足
]
fixable = ["ALL"] ## auto fixの対象
unfixable = []

[tool.ruff.lint.pylint]
max-args = 8 # 引数の許容上限

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",    # テストファイルではassertの使用を許可
    "ANN201",  # テスト関数の戻り値アノテーションは不要
    "ANN202",  # プライベート関数の戻り値アノテーションは不要
    "PLR2004", # マジックナンバー（HTTPステータスコード等）の使用を許可
]
"app/models/*" = [
    "ERA001", # 一時的に許可する（PoC段階はミニマムなモデルにするため一部をコメントアウトしたい）
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
