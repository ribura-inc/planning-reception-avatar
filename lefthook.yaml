pre-commit:
  parallel: true
  commands:
    markdownlint:
      glob: "**/*.md"
      run: npx markdownlint-cli2 {staged_files} --config .markdownlint.yaml --fix
      stage_fixed: true
    ruff-format:
      glob: "**/*.py"
      run: uvx ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "**/*.py"
      run: uvx ruff check {staged_files} --fix --unsafe-fixes
      stage_fixed: true
